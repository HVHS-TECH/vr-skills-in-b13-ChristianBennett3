<!DOCTYPE html>
<html>
  <head>

<script src="https://aframe.io/releases/1.1.0/aframe.min.js"></script>
<script src="https://rawgit.com/donmccurdy/aframe-extras/v2.1.1/dist/aframe-extras.loaders.min.js"></script> 

  </head>
    <body>
    <a-scene>
      <a-sky color="lightblue"></a-sky>
      
      <a-entity 
        ply-model="src:coolguy.ply"
        position="0 2 -2""
        rotation="-90 0 0"
        animation="
                property: rotation;
                from: 90 90 0;
                to: -90 -0 180;
                loop: true;
                dir: alternate;
        "
      ></a-entity>
                 
    </a-scene>
  </body>
</html>
