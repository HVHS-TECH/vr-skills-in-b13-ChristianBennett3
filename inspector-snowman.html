<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
    </head>
    <body>
        <a-scene>
            <a-sky
                color="lightblue"
            ></a-sky>

            <a-plane
                scale="50 50"
                color="mediumseagreen"
                rotation="-90 0 0"
            ></a-plane>

             <a-sphere
                scale="1 1 1"
                color="white"
                position="0 1 0"
            ></a-sphere>
            
            <a-sphere
                scale="0.75 0.75 0.75"
                color="white"
                position="0 2.5 0"
            ></a-sphere>

            <a-sphere
                scale="0.5 0.5 0.5"
                color="white"
                position="0 3.5 0"
            ></a-sphere>

            <a-cylinder
                height="0.5"
                scale="0.7 0.1 0.7"
                color="black"
                position="0 4 0"
            ></a-cylinder>

            <a-cylinder
                scale="0.4 0.5 0.4"
                color="black"
                position="0 4.25 0"
            ></a-cylinder>

            <a-cone
                position="0 3.5 0.5"
                scale="0.1 1 0.1"
                color="orange"
                rotation="-90 -90 -90"
            ></a-cone>
            
        <!-- THIS IS WHERE YOUR CODE WILL GO -->
        </a-scene>
    </body>
</html>
